<?xml version="1.0" encoding="UTF-8"?>
<!--
  TUI 原型图 · 权限确认弹层。纯 SVG 自绘(无 foreignObject——iOS 上它会破坏 <img> 引用时的缩放)。
  弹层为绝对居中的黑底黄框 modal:宽 80% × 高 62%,与 tui/confirm.rs 的呈现一致。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 660" width="1012" height="660"
     style="max-width:100%;height:auto" role="img" aria-labelledby="tui-confirm-title tui-confirm-desc">
  <title id="tui-confirm-title">Lex Code TUI 原型 — 权限确认弹层</title>
  <desc id="tui-confirm-desc">file_edit 的确认弹层:展示编辑文件名、带色 diff(增行绿 / 删行红)与按键提示,禁止"是否继续?"式笼统确认。</desc>
  <style><![CDATA[
    text { font-family: "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace; font-size: 14px; }
  ]]></style>

  <rect x="0.5" y="0.5" width="1011" height="659" rx="12" fill="#161b22" stroke="#21262d"/>
  <rect x="10.5" y="10.5" width="991" height="639" rx="8" fill="#0d1117" stroke="#21262d"/>

  <!-- 下层:双栏 + 输入盒 + 容量行 + 状态行 -->
  <rect x="24" y="25" width="714" height="275" rx="6" fill="#0d1117" stroke="#30363d"/>
  <rect x="34" y="16" width="46" height="18" fill="#0d1117"/>
  <text x="39" y="30" fill="#c9d1d9" xml:space="preserve"> 对话 </text>
  <text x="34" y="55" fill="#c9d1d9" xml:space="preserve">好的,我先给正文加上折行,避免超宽内容被截断。</text>

  <rect x="750" y="25" width="240" height="275" rx="6" fill="#0d1117" stroke="#30363d"/>
  <rect x="760" y="16" width="46" height="18" fill="#0d1117"/>
  <text x="765" y="30" fill="#c9d1d9" xml:space="preserve"> 待办 </text>
  <text x="760" y="55" fill="#3b82f6" xml:space="preserve">◐ 正文按显示高度折行</text>

  <rect x="24" y="310" width="966" height="54" rx="6" fill="none" stroke="#30363d"/>
  <rect x="34" y="301" width="280" height="18" fill="#0d1117"/>
  <text x="39" y="315" fill="#c9d1d9" xml:space="preserve"> 输入(Enter 提交,Ctrl+C 中断/退出) </text>
  <text x="36" y="337" fill="#c9d1d9" xml:space="preserve"><tspan fill="#3b82f6" font-weight="700" textLength="17">› </tspan></text>

  <text x="36" y="384" fill="#8b949e" xml:space="preserve">上下文 9600/64000 tokens(15%)</text>
  <text x="36" y="406" fill="#8b949e" xml:space="preserve">等待确认…</text>
  <text x="990" y="406" text-anchor="end" fill="#8b949e" xml:space="preserve">输入 5120 · 输出 386 · 缓存命中 4800</text>

  <!-- 上层:确认弹层(黑底压住下层,黄边框) -->
  <rect x="109.5" y="132" width="793" height="396" fill="#000000" stroke="#d29922"/>
  <rect x="119.5" y="123" width="162" height="18" fill="#000000"/>
  <text x="124.5" y="137" fill="#c9d1d9" xml:space="preserve"> 确认操作 [file_edit] </text>
  <text x="124" y="157" fill="#d29922" xml:space="preserve">编辑文件: lex-cli/src/tui/draw.rs</text>
  <text x="124" y="179" fill="#c9d1d9" xml:space="preserve"> </text>
  <text x="124" y="201" fill="#3b82f6" xml:space="preserve">文件: lex-cli/src/tui/draw.rs</text>
  <text x="124" y="223" fill="#8b949e" xml:space="preserve">  use ratatui::widgets::Paragraph;</text>
  <text x="124" y="245" fill="#8b949e" xml:space="preserve">  </text>
  <text x="124" y="267" fill="#f85149" xml:space="preserve">- use ratatui::widgets::Paragraph;</text>
  <text x="124" y="289" fill="#3fb950" xml:space="preserve">+ use ratatui::widgets::{Paragraph, Wrap};</text>
  <text x="124" y="311" fill="#8b949e" xml:space="preserve">  </text>
  <text x="124" y="333" fill="#8b949e" xml:space="preserve">  f.render_widget(Paragraph::new(lines), inner);</text>
  <text x="124" y="355" fill="#3fb950" xml:space="preserve">+ f.render_widget(Paragraph::new(lines).wrap(Wrap { trim: false }), inner);</text>
  <text x="124" y="508" fill="#8b949e" xml:space="preserve">[y] 允许 · [n/Esc] 拒绝 · PgUp/PgDn 滚动 3/12</text>
</svg>
