<?xml version="1.0" encoding="UTF-8"?>
<!--
  TUI 原型图 · /settings 设置页(模块 0 详情 + 字段编辑态)。纯 SVG 自绘(无 foreignObject)。
  字段两列对齐见下方设置页主体处的说明:键自然排布,值列统一从 x=380 起。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 660" width="1012" height="660"
     style="max-width:100%;height:auto" role="img" aria-labelledby="tui-settings-title tui-settings-desc">
  <title id="tui-settings-title">Lex Code TUI 原型 — /settings 设置页</title>
  <desc id="tui-settings-desc">设置页模块一(模型与 Provider):provider / model / base_url / max_tokens / thinking / reasoning_effort 字段列表,model 字段处于编辑态,保存后写回 lex-code.toml 并热生效。</desc>
  <style><![CDATA[
    text { font-family: "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace; font-size: 14px; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  ]]></style>

  <rect x="0.5" y="0.5" width="1011" height="659" rx="12" fill="#161b22" stroke="#21262d"/>
  <rect x="10.5" y="10.5" width="991" height="639" rx="8" fill="#0d1117" stroke="#21262d"/>

  <!--
    字段两列对齐:键自然排布(最长 308px,Cascadia 下最宽),值列统一从 x=380 起。
    给键钉死 textLength 反而会把字母撑开,故这里只固定值列起点。
  -->
  <text x="36" y="50" fill="#c9d1d9" xml:space="preserve"><tspan fill="#8b949e">设置 </tspan><tspan fill="#3b82f6">›</tspan><tspan fill="#8b949e"> 模块 1/4</tspan></text>
  <text x="36" y="74" fill="#3b82f6" font-weight="700" xml:space="preserve">模型与 Provider</text>
  <text x="36" y="98" fill="#8b949e" xml:space="preserve">provider / model / base_url 保存后立即重建 provider,热生效。</text>

  <text x="36" y="148" fill="#8b949e" xml:space="preserve">  provider</text>
  <text x="380" y="148" fill="#c9d1d9" xml:space="preserve">openai</text>
  <text x="36" y="172" fill="#3b82f6" font-weight="700" xml:space="preserve">› model</text>
  <text x="380" y="172" fill="#3b82f6" font-weight="700" xml:space="preserve">deepseek-chat</text>
  <text x="36" y="196" fill="#8b949e" xml:space="preserve">  base_url</text>
  <text x="380" y="196" fill="#c9d1d9" xml:space="preserve">https://api.deepseek.com</text>
  <text x="36" y="220" fill="#8b949e" xml:space="preserve">  max_tokens</text>
  <text x="380" y="220" fill="#c9d1d9" xml:space="preserve">8192</text>
  <text x="36" y="244" fill="#8b949e" xml:space="preserve">  thinking(仅 openai,空=不发送)</text>
  <text x="380" y="244" fill="#c9d1d9" xml:space="preserve">(空)</text>
  <text x="36" y="268" fill="#8b949e" xml:space="preserve">  reasoning_effort(仅 openai,空=不发送)</text>
  <text x="380" y="268" fill="#c9d1d9" xml:space="preserve">high</text>
  <text x="36" y="298" fill="#8b949e" xml:space="preserve">↑↓ 选择字段 · Enter 进入编辑 · Esc 返回模块列表 · q 退出设置页</text>

  <!-- 字段编辑态输入盒 + 容量行 + 状态行 -->
  <rect x="24" y="532" width="966" height="54" rx="6" fill="none" stroke="#3b82f6"/>
  <rect x="34" y="523" width="270" height="18" fill="#0d1117"/>
  <text x="39" y="537" fill="#c9d1d9" xml:space="preserve"> 编辑 model(Enter 保存,Esc 取消) </text>
  <text x="36" y="557" fill="#c9d1d9" xml:space="preserve"><tspan fill="#3b82f6" font-weight="700" textLength="17">› </tspan><tspan x="53">deepseek-chat</tspan></text>
  <rect class="cursor" x="179" y="542" width="8.4" height="19" fill="#c9d1d9"/>
  <text x="36" y="606" fill="#8b949e" xml:space="preserve">主输入已暂存,Esc 恢复</text>
  <text x="36" y="628" fill="#8b949e" xml:space="preserve">设置 · 编辑中</text>
  <text x="990" y="628" text-anchor="end" fill="#8b949e" xml:space="preserve">保存即写回 lex-code.toml</text>
</svg>
