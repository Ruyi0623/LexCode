[package]
name = "lex-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
dirs = "5"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
